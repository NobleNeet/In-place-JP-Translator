<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLaMo 2 Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PLaMo 2 Translate</h1>
      <div id="status" class="status">idle</div>
    </header>

    <div class="actions">
      <button id="translateBtn" class="btn primary">Translate Page</button>
      <button id="stopBtn" class="btn">Stop</button>
    </div>

    <label class="row">
      <span>API profile</span>
      <select id="profile"></select>
    </label>

    <label class="row">
      <span>Mode</span>
      <select id="mode">
        <option value="single">single</option>
        <option value="fallback" disabled>fallback (coming soon)</option>
        <option value="balanced" disabled>balanced (coming soon)</option>
      </select>
    </label>

    <label class="row">
      <span>Max concurrent requests</span>
      <select id="concurrency">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
      </select>
    </label>

    <section class="stats">
      <div class="stat"><span class="label">segments</span><span id="segCount" class="value">0</span></div>
      <div class="stat"><span class="label">translated</span><span id="transCount" class="value">0</span></div>
      <div class="stat"><span class="label">failed</span><span id="failCount" class="value">0</span></div>
    </section>

    <details class="debug">
      <summary>Debug (console)</summary>
      <p class="hint">Open DevTools &rarr; Console and filter by <code>[PLaMoTranslate]</code>.</p>
    </details>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="../api/profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
